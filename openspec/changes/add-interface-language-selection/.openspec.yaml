goal: "Дать пользователю возможность выбрать язык интерфейса Agent Progress:
  следовать языку OpenChamber по умолчанию либо явно выбрать English или
  Русский. Разместить компактный элемент Language в нижней служебной области
  боковой панели и полноэкранной страницы рядом с Setup и Details, независимо от
  наличия плана и завершения настройки. Сохранять единый выбор для всех трёх
  представлений расширения, включая Work Status, без отдельного переключателя в
  компактном блоке. Переводить интерфейсные подписи и сообщения расширения, не
  изменяя названия и содержимое планов, задач и документов."
