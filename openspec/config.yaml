schema: spec-driven

context: |
  This repository is public. Exclude secrets, private tracker references,
  personal or environment identifiers, raw logs and private planning evidence.
  Write every OpenSpec artifact (proposal, design, specs, tasks and change
  metadata) in English, whatever language the product interface supports.
  docs/contracts.md, docs/backend.md, docs/ui.md, docs/setup.md and
  docs/compatibility.md remain the contract of record. Update the affected
  guides in the same change as the behaviour.
  TypeScript is authoritative. Regenerate affected tracked backend and guest
  outputs with the existing repository scripts; never edit bundles by hand.

rules:
  proposal:
    - State scope and explicit non-goals.
  design:
    - Explain migration, mixed-version compatibility and rollback when relevant.
  tasks:
    - Include affected documentation, generated outputs and behavioural checks.
