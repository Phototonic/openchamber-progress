name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  gate:
    name: Select check execution
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        # Actions string comparisons ignore case; Bash matches literal branch names.
        run: |
          run=true
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" == "$REPOSITORY" && ( "$HEAD_REF" == main || "$HEAD_REF" == dev ) ]]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  portable:
    name: Linux tests and packages
    # Same-repository main/dev heads already receive every check on push.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    # A newer push to the same pull request supersedes its earlier run. Pushes to
    # main and dev are grouped by commit and never cancelled, and the publish job
    # keeps its own serialized group.
    concurrency:
      group: ${{ github.workflow }}-portable-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install ZIP tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Linux tests, builds and package checks
        id: check
        run: node --experimental-strip-types scripts/ci.ts
      - name: Release credit reminder (advisory)
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/release-credits.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save tested release packages
        if: steps.check.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  node-latest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # The exact pin above is the release gate. This job runs the same checks on
    # the newest Node 24 release, which the documented range also accepts.
    name: Linux tests on latest Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-node-latest-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install ZIP tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Linux tests, builds and package checks
        run: node --experimental-strip-types scripts/ci.ts
  windows-native:
    name: Windows setup, storage and capture
    runs-on: windows-2025
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-windows-native-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test Windows setup, storage and capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted Windows runners are elevated; test the supported normal-user
          # ownership semantics without relaxing the product's SID policy.
          $name = 'progress' + [Guid]::NewGuid().ToString('N').Substring(0, 10)
          $password = ConvertTo-SecureString ('Aa1!' + [Guid]::NewGuid().ToString('N')) -AsPlainText -Force
          $output = Join-Path $env:RUNNER_TEMP ($name + '.stdout')
          $errors = Join-Path $env:RUNNER_TEMP ($name + '.stderr')
          $created = $false
          try {
            $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
            $created = $true
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
            $credential = [PSCredential]::new(($env:COMPUTERNAME + '\' + $name), $password)
            $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList '--experimental-strip-types --test tests/backend/windows-platform.test.ts' -WorkingDirectory $env:GITHUB_WORKSPACE -Credential $credential -LoadUserProfile -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors
            if (Test-Path $output) { Get-Content -LiteralPath $output }
            if (Test-Path $errors) { Get-Content -LiteralPath $errors }
            if ($process.ExitCode -ne 0) { throw 'Native Windows tests failed.' }
          } finally {
            if ($created) { Remove-LocalUser -Name $name }
            Remove-Item -LiteralPath $output, $errors -Force -ErrorAction SilentlyContinue
          }
  publish:
    name: Publish GitHub release
    needs: [portable, windows-native]
    if: github.event_name == 'push' && github.repository == 'Phototonic/openchamber-progress' && github.ref == 'refs/heads/main' && needs.portable.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-v${{ needs.portable.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Download tested release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets
      - name: Publish release with GitHub release notes
        run: node --experimental-strip-types scripts/release.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
