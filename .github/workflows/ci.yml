name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: Select check execution
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      windows: ${{ steps.decide.outputs.windows }}
      windows_full: ${{ steps.decide.outputs.windows_full }}
    steps:
      # Pull requests only: the file list decides whether a docs-only change
      # can skip the check jobs.
      - name: Get source code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Actions string comparisons ignore case; Bash matches literal branch names.
        run: |
          run=true
          if [[ "$EVENT_NAME" == pull_request && "${BASE_REF:-}" != main && "$HEAD_REPOSITORY" == "$REPOSITORY" && ( "$HEAD_REF" == main || "$HEAD_REF" == dev ) ]]; then
            run=false
          fi
          # A pull request that only changes documentation or OpenSpec text skips
          # the check jobs. Packaged or test-read files, any other path, an empty
          # list or a failed listing keep every check.
          if [[ "$run" == true && "$EVENT_NAME" == pull_request && -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
            if files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" 2>/dev/null) && [[ -n "$files" ]]; then
              docs_only=true
              while IFS= read -r file; do
                case "$file" in
                  docs/setup.md|docs/tracking.md|openspec/changes/archive/*) docs_only=false ;;
                  docs/*|openspec/*|README.md|CONTRIBUTING.md|AGENTS.md|.github/PULL_REQUEST_TEMPLATE.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
              if [[ "$docs_only" == true ]]; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # Release validation always includes the slow native journeys, even
          # for documentation-only promotion PRs. Other pushes use the fast set.
          windows=true
          windows_full=false
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch || ( "$EVENT_NAME" == push && "${REF:-}" == refs/heads/main ) || ( "$EVENT_NAME" == pull_request && "${BASE_REF:-}" == main ) ]]; then
            windows_full=true
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ "$run" == false ]]; then
              windows=false
            elif [[ -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
              if files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" 2>/dev/null) && [[ -n "$files" ]]; then
                windows=false
                while IFS= read -r file; do
                  case "$file" in
                    # Native imports and backend build entries/payloads.
                    service/*|setup/*|shared/*|plugin/*|scripts/*|package.json|bun.lock|tsconfig.json|build/service/*|build/setup/*|build/companion/*|tests/backend/windows-*|tests/fixtures/windows-*|.github/workflows/*) windows=true ;;
                    # Known independent surfaces; unknown paths fail open.
                    ui/*|background/*|tests/browser/*|docs/*|openspec/*|README.md|CONTRIBUTING.md|AGENTS.md|.github/PULL_REQUEST_TEMPLATE.md) ;;
                    *) windows=true ;;
                  esac
                done <<< "$files"
              fi
            fi
          fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "windows_full=$windows_full" >> "$GITHUB_OUTPUT"
  portable:
    name: Linux tests and packages
    # Same-repository main/dev heads already receive every check on push.
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    # A newer push to the same pull request supersedes its earlier run. Pushes to
    # main and dev are grouped by commit and never cancelled, and the publish job
    # keeps its own serialized group.
    concurrency:
      group: ${{ github.workflow }}-portable-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install ZIP tools
        # Hosted images already carry both tools; install only if one is missing.
        run: command -v zip >/dev/null && command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip unzip)
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Linux tests, builds and package checks
        id: check
        run: node --experimental-strip-types scripts/ci.ts
      - name: Release credit reminder (advisory)
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/release-credits.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save tested release packages
        if: steps.check.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  node-latest:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    # The exact pin above is the release gate. This job runs the same checks on
    # the newest Node 24 release, which the documented range also accepts.
    name: Linux tests on latest Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-node-latest-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install ZIP tools
        # Hosted images already carry both tools; install only if one is missing.
        run: command -v zip >/dev/null && command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip unzip)
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Linux tests, builds and package checks
        run: node --experimental-strip-types scripts/ci.ts
  windows-native:
    name: Windows setup, storage and capture
    runs-on: windows-2025
    needs: gate
    if: needs.gate.outputs.windows == 'true'
    timeout-minutes: 25
    env:
      AP_WINDOWS_FULL: ${{ needs.gate.outputs.windows_full == 'true' && '1' || '0' }}
    concurrency:
      group: ${{ github.workflow }}-windows-native-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch released Windows migration fixture
        if: env.AP_WINDOWS_FULL == '1'
        run: git fetch --no-tags origin tag v1.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build service and companion entries
        run: bun run build:backend
      - name: Test Windows setup, storage and capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted Windows runners are elevated; test the supported normal-user
          # ownership semantics without relaxing the product's SID policy.
          $name = 'progress' + [Guid]::NewGuid().ToString('N').Substring(0, 10)
          $password = ConvertTo-SecureString ('Aa1!' + [Guid]::NewGuid().ToString('N')) -AsPlainText -Force
          $trace = Join-Path $env:RUNNER_TEMP 'windows-migration-trace.jsonl'
          # The two native files run side by side, each in its own serial test
          # runner. Only the service file starts a server and request workers,
          # which are what take Setup coordination ports; the platform file
          # drives the setup controller directly. Each runs under Start-Process
          # -Wait inside a thread job, so it is waited for with everything it
          # started, exactly as when they ran one after the other. Starting the
          # two at the same instant can be refused once, so the start is retried.
          $runs = @('windows-platform', 'windows-service') | ForEach-Object {
            [pscustomobject]@{
              File = $_
              Output = Join-Path $env:RUNNER_TEMP ($name + '.' + $_ + '.stdout')
              Errors = Join-Path $env:RUNNER_TEMP ($name + '.' + $_ + '.stderr')
              Job = $null
              ExitCode = $null
            }
          }
          # Leave a fixed diagnostic even if principal/process creation fails.
          '{"request":"runner-start","completed":false}' | Set-Content -LiteralPath $trace -Encoding utf8
          $created = $false
          try {
            $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
            $created = $true
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
            $credential = [PSCredential]::new(($env:COMPUTERNAME + '\' + $name), $password)
            foreach ($run in $runs) {
              $run.Job = Start-ThreadJob -ArgumentList $run, $credential, $env:GITHUB_WORKSPACE, (Get-Command node).Source -ScriptBlock {
                param($run, $credential, $workspace, $node)
                # The secondary logon service creates one process at a time and
                # refuses a second request while it is busy; retry only that refusal.
                $process = $null
                for ($attempt = 1; -not $process; $attempt++) {
                  try {
                    $process = Start-Process -FilePath $node -ArgumentList "--experimental-strip-types --test --test-concurrency=1 tests/backend/$($run.File).test.ts" -WorkingDirectory $workspace -Credential $credential -LoadUserProfile -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $run.Output -RedirectStandardError $run.Errors -ErrorAction Stop
                  } catch {
                    if ($attempt -ge 30 -or $_.Exception.Message -notmatch 'already running') { throw }
                    Start-Sleep -Seconds 1
                  }
                }
                $process.ExitCode
              }
            }
            $null = $runs.Job | Wait-Job
            foreach ($run in $runs) { $run.ExitCode = @(Receive-Job -Job $run.Job -ErrorAction Stop)[-1] }
            foreach ($run in $runs) {
              if (Test-Path $run.Output) {
                Get-Content -LiteralPath $run.Output
              }
              if (Test-Path $run.Errors) { Get-Content -LiteralPath $run.Errors }
            }
            if (@($runs | Where-Object { $_.ExitCode -ne 0 }).Count -gt 0) { throw 'Native Windows tests failed.' }
          } finally {
            # Preserve per-request evidence even on an assertion/process failure.
            # Never upload raw stdout/stderr, local principal names or paths.
            foreach ($run in $runs) {
              if (Test-Path $run.Output) {
                $traces = @(Get-Content -LiteralPath $run.Output | ForEach-Object {
                  if ($_ -match '^\s*(?:#\s*)?WINDOWS_MIGRATION_TRACE (.+)$') { $Matches[1] }
                })
                if ($traces.Count -gt 0) { $traces | Add-Content -LiteralPath $trace -Encoding utf8 }
              }
            }
            if ($created) { Remove-LocalUser -Name $name }
            Remove-Item -LiteralPath @($runs | ForEach-Object { $_.Output; $_.Errors }) -Force -ErrorAction SilentlyContinue
          }
          $requests = @(Get-Content -LiteralPath $trace | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.request -and $_.request -notin @('runner-start','summary') })
          if ($requests.Count -eq 0) { throw 'Native Windows request trace is missing.' }
      - name: Upload sanitized Windows migration trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-migration-trace
          path: ${{ runner.temp }}/windows-migration-trace.jsonl
          if-no-files-found: warn
  publish:
    name: Publish GitHub release
    needs: [portable, windows-native]
    if: github.event_name == 'push' && github.repository == 'Phototonic/openchamber-progress' && github.ref == 'refs/heads/main' && needs.portable.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-v${{ needs.portable.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Download tested release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets
      - name: Publish release with GitHub release notes
        run: node --experimental-strip-types scripts/release.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
