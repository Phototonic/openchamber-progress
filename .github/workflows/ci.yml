name: Portable checks and future releases
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: sudo apt-get update && sudo apt-get install -y zip unzip
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: check
        run: node --experimental-strip-types scripts/ci.ts
      - if: steps.check.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Initialize built-in Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $null = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $null = [Security.AccessControl.DirectorySecurity]::new()
          $null = '{"warm":true}' | ConvertFrom-Json | ConvertTo-Json
      - run: node --experimental-strip-types --test tests/backend/windows-platform.test.ts
  publish:
    needs: [portable, windows-native]
    if: github.event_name == 'push' && github.repository == 'Phototonic/openchamber-progress' && github.ref == 'refs/heads/main' && needs.portable.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-v${{ needs.portable.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets
      - name: Publish complete matching assets with native GitHub notes
        run: node --experimental-strip-types scripts/release.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
