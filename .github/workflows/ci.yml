name: Linux and Windows checks
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  portable:
    name: Linux tests and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install ZIP tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Linux tests, builds and package checks
        id: check
        run: node --experimental-strip-types scripts/ci.ts
      - name: Save tested release packages
        if: steps.check.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  windows-native:
    name: Windows setup, storage and capture
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install project dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test Windows setup, storage and capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted Windows runners are elevated; test the supported normal-user
          # ownership semantics without relaxing the product's SID policy.
          $name = 'progress' + [Guid]::NewGuid().ToString('N').Substring(0, 10)
          $password = ConvertTo-SecureString ('Aa1!' + [Guid]::NewGuid().ToString('N')) -AsPlainText -Force
          $output = Join-Path $env:RUNNER_TEMP ($name + '.stdout')
          $errors = Join-Path $env:RUNNER_TEMP ($name + '.stderr')
          $created = $false
          try {
            $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
            $created = $true
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
            $credential = [PSCredential]::new(($env:COMPUTERNAME + '\' + $name), $password)
            $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList '--experimental-strip-types --test tests/backend/windows-platform.test.ts' -WorkingDirectory $env:GITHUB_WORKSPACE -Credential $credential -LoadUserProfile -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors
            if (Test-Path $output) { Get-Content -LiteralPath $output }
            if (Test-Path $errors) { Get-Content -LiteralPath $errors }
            if ($process.ExitCode -ne 0) { throw 'Native Windows tests failed.' }
          } finally {
            if ($created) { Remove-LocalUser -Name $name }
            Remove-Item -LiteralPath $output, $errors -Force -ErrorAction SilentlyContinue
          }
  publish:
    name: Publish GitHub release
    needs: [portable, windows-native]
    if: github.event_name == 'push' && github.repository == 'Phototonic/openchamber-progress' && github.ref == 'refs/heads/main' && needs.portable.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-v${{ needs.portable.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Download tested release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-${{ github.sha }}
          path: release-assets
      - name: Publish release with GitHub release notes
        run: node --experimental-strip-types scripts/release.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
