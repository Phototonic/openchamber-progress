name: Secrets scan
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    # Re-scan the full history of the default branch weekly.
    - cron: '23 3 * * 2'
permissions:
  contents: read
jobs:
  gate:
    name: Select check execution
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        # Actions string comparisons ignore case; Bash matches literal branch names.
        run: |
          run=true
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" == "$REPOSITORY" && ( "$HEAD_REF" == main || "$HEAD_REF" == dev ) ]]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  gitleaks:
    name: Scan for secrets
    # Full-history push and weekly scans remain independent of PR deduplication.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gitleaks"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$directory/gitleaks.tar.gz"
          # SHA-256 of the official Gitleaks v8.30.1 Linux x64 release asset.
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$directory/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          echo "$directory" >> "$GITHUB_PATH"
      # The action's PR mode selects its range from one unpaginated commits
      # request (30 results), silently skipping later commits. Direct CLI scanning
      # covers every commit on the checked-out ref, including the PR merge ref.
      # --log-opts is required for merge coverage: `git log -p` omits merge-commit
      # diffs by default, and supplying --log-opts replaces gitleaks' own defaults,
      # so --full-history --all are restated alongside -m (diff each merge commit
      # against every parent, catching secrets introduced only in a resolution).
      - name: Scan full Git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1 --config .gitleaks.toml --log-opts='--full-history --all -m'
