name: CodeQL
on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '43 3 * * 2'
permissions:
  security-events: write
  contents: read
# A newer push to the same pull request supersedes its earlier run. Pushes to
# main and dev are grouped by commit, so those runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Select check execution
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Pull requests only: the file list decides whether a docs-only change
      # can skip the check jobs.
      - name: Get source code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Actions string comparisons ignore case; Bash matches literal branch names.
        run: |
          run=true
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" == "$REPOSITORY" && ( "$HEAD_REF" == main || "$HEAD_REF" == dev ) ]]; then
            run=false
          fi
          # A pull request that only changes documentation or OpenSpec text skips
          # the check jobs. Packaged or test-read files, any other path, an empty
          # list or a failed listing keep every check.
          if [[ "$run" == true && "$EVENT_NAME" == pull_request && -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
            if files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" 2>/dev/null) && [[ -n "$files" ]]; then
              docs_only=true
              while IFS= read -r file; do
                case "$file" in
                  docs/setup.md|docs/tracking.md|openspec/changes/archive/*) docs_only=false ;;
                  docs/*|openspec/*|README.md|CONTRIBUTING.md|AGENTS.md|.github/PULL_REQUEST_TEMPLATE.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
              if [[ "$docs_only" == true ]]; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  analyze:
    name: Analyze JavaScript and TypeScript
    # Keep push/default-branch coverage; only skip duplicate same-repository PRs.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
