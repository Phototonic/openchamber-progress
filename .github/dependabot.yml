version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Version updates target the development branch; main receives them through releases.
    # Dependabot security updates always target the default branch and ignore this setting.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # Every codeql-action step must use the same version, so update them together.
      codeql-action:
        patterns:
          - github/codeql-action*
# npm/Bun updates are intentionally omitted: Dependabot does not support bun.lock
# lockfiles. Dependency alerts still use the dependency graph via package.json.
